<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리동네 농산물 판매장</title>

  <!-- Leaflet (OpenStreetMap) - API 키 불필요 -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- Teachable Machine 채소 분류 모델 (TensorFlow.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <style>
    :root {
      --green: #2e7d32;
      --green-dark: #1b5e20;
      --bg: #f5f7f4;
      --card: #ffffff;
      --text: #263238;
      --muted: #6b7770;
      --border: #e2e8dd;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic",
        "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--green);
      color: #fff;
      padding: 14px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      z-index: 500;
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }

    .layout {
      height: 72vh;
      min-height: 420px;
      display: flex;
    }

    /* 사이드바 (목록 + 필터) */
    .sidebar {
      width: 360px;
      max-width: 42vw;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .controls {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .search {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .search:focus { border-color: var(--green); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover { border-color: var(--green); }
    .chip.active {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .locate-btn {
      margin-top: 10px;
      width: 100%;
      padding: 9px;
      border: 1px solid var(--green);
      background: #fff;
      color: var(--green);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .locate-btn:hover { background: #eef6ee; }

    .count {
      padding: 8px 14px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .list {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    .item {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
    }
    .item:hover { background: #f2f7f1; }
    .item.active { background: #e6f2e6; border-left: 4px solid var(--green); padding-left: 10px; }
    .item h3 { margin: 0 0 4px; font-size: 15px; }
    .item .addr { font-size: 13px; color: var(--muted); margin: 2px 0; }
    .item .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      font-size: 11px;
      background: #eef2ec;
      color: var(--green-dark);
      border-radius: 4px;
      padding: 2px 7px;
    }
    .item .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }

    /* 지도 */
    #map { flex: 1; min-height: 0; }

    .popup-title { font-size: 15px; font-weight: 700; margin: 0 0 4px; color: var(--green-dark); }
    .popup-addr { font-size: 13px; color: #444; margin: 2px 0; }
    .popup-tags { margin-top: 6px; }
    .popup-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
      color: var(--green);
      text-decoration: none;
      font-weight: 600;
    }

    /* ── AI 채소 판별 섹션 ── */
    .ai-section {
      background: linear-gradient(180deg, #f0f6ee 0%, #e6f0e2 100%);
      border-top: 3px solid var(--green);
      padding: 34px 20px 52px;
    }
    .ai-inner { max-width: 960px; margin: 0 auto; }
    .ai-section h2 { margin: 0 0 6px; font-size: 22px; color: var(--green-dark); }
    .ai-desc { margin: 0 0 18px; color: #4a5a4a; font-size: 14px; line-height: 1.6; }
    .ai-desc small { color: var(--muted); }

    .ai-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .ai-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--green); color: #fff; border: none;
      padding: 11px 18px; border-radius: 10px; font-size: 14px;
      font-weight: 600; cursor: pointer;
    }
    .ai-btn:hover { background: var(--green-dark); }
    .ai-btn-outline { background: #fff; color: var(--green); border: 1px solid var(--green); }
    .ai-btn-outline:hover { background: #eef6ee; }
    .ai-btn-ghost { background: #fff; color: #b00020; border: 1px solid #e0b4b4; }

    .ai-status { font-size: 13px; color: var(--muted); margin-bottom: 16px; min-height: 18px; }

    .ai-stage { display: flex; gap: 20px; flex-wrap: wrap; }
    .ai-preview {
      flex: 1 1 320px; min-width: 260px; max-width: 380px; aspect-ratio: 1 / 1;
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .ai-placeholder { color: #9aa89a; font-size: 14px; text-align: center; padding: 20px; }
    .ai-img, .ai-preview canvas, .ai-preview video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    .ai-result { flex: 1 1 320px; min-width: 260px; }
    .ai-bars { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .bar-row { font-size: 13px; }
    .bar-label { display: flex; justify-content: space-between; margin-bottom: 3px; color: #3a463a; }
    .bar-track { background: #dfe7db; border-radius: 6px; height: 12px; overflow: hidden; }
    .bar-fill { background: var(--green); height: 100%; width: 0; transition: width 0.25s; border-radius: 6px; }
    .bar-row.top .bar-fill { background: #f57c00; }
    .bar-row.top .bar-label { font-weight: 700; color: var(--green-dark); }

    .ai-explain {
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      padding: 16px 18px; min-height: 60px;
    }
    .ai-explain.empty { color: #9aa89a; font-size: 14px; }
    .ai-explain h3 { margin: 0 0 8px; font-size: 18px; color: var(--green-dark); }
    .ai-explain p { margin: 0 0 10px; font-size: 14px; line-height: 1.65; color: #3a463a; }
    .ai-explain ul { margin: 0; padding-left: 18px; font-size: 13px; color: #4a5a4a; line-height: 1.7; }

    @media (max-width: 720px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; max-width: 100%; height: 45%; border-right: none; border-bottom: 1px solid var(--border); }
      #map { height: 55%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🥬 우리동네 농산물 판매장</h1>
    <p>채소 · 달걀 · 과일 등 신선한 지역 농산물을 파는 직매장을 지도에서 찾아보세요.</p>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="controls">
        <input
          id="search"
          class="search"
          type="text"
          placeholder="판매장 이름·지역·품목 검색 (예: 달걀, 강남)"
        />
        <div class="filters" id="filters"></div>
        <button class="locate-btn" id="locateBtn">📍 내 위치에서 가까운 순으로 보기</button>
      </div>
      <div class="count" id="count"></div>
      <div class="list" id="list"></div>
    </aside>

    <div id="map"></div>
  </div>

  <!-- ── AI 채소 판별 섹션 ── -->
  <section class="ai-section" id="ai">
    <div class="ai-inner">
      <h2>🥕 채소 알아보기 — AI 판별기</h2>
      <p class="ai-desc">
        채소(또는 달걀) 사진을 올리거나 웹캠에 비추면 AI가 무엇인지 알아맞히고 설명해 드려요.<br />
        <small>인식 가능: 당근 · 양파 · 오이 · 호박 · 달걀 &nbsp;|&nbsp; Teachable Machine 모델 사용</small>
      </p>

      <div class="ai-controls">
        <button id="btnWebcam" class="ai-btn">📷 웹캠으로 인식</button>
        <label class="ai-btn ai-btn-outline">
          🖼️ 사진 업로드
          <input type="file" id="fileInput" accept="image/*" hidden />
        </label>
        <button id="btnStop" class="ai-btn ai-btn-ghost" hidden>■ 웹캠 끄기</button>
      </div>

      <div id="aiStatus" class="ai-status">모델을 준비하는 중…</div>

      <div class="ai-stage">
        <div class="ai-preview" id="preview">
          <div class="ai-placeholder">여기에 사진/영상이 표시됩니다</div>
        </div>
        <div class="ai-result">
          <div id="bars" class="ai-bars"></div>
          <div id="explain" class="ai-explain empty">사진을 인식하면 여기에 설명이 표시됩니다.</div>
        </div>
      </div>
    </div>
  </section>

  <script>
    // ── 판매장 데이터 (예시) ─────────────────────────────
    // 실제 운영 데이터로 교체해서 사용하세요.
    const MARKETS = [
      {
        name: "가락몰 농산물 직판장",
        address: "서울 송파구 양재대로 932",
        lat: 37.4939, lng: 127.1105,
        items: ["채소", "과일", "달걀"],
        hours: "05:00 ~ 22:00",
        phone: "02-3435-1000"
      },
      {
        name: "강동 로컬푸드 직매장",
        address: "서울 강동구 고덕로 262",
        lat: 37.5559, lng: 127.1543,
        items: ["채소", "달걀", "쌀"],
        hours: "09:00 ~ 20:00",
        phone: "02-1544-0000"
      },
      {
        name: "양재 하나로마트 신선코너",
        address: "서울 서초구 강남대로 27",
        lat: 37.4699, lng: 127.0389,
        items: ["채소", "과일", "달걀", "육류"],
        hours: "09:00 ~ 21:00",
        phone: "02-3498-1000"
      },
      {
        name: "은평 로컬푸드 직매장",
        address: "서울 은평구 통일로 1050",
        lat: 37.6360, lng: 126.9188,
        items: ["채소", "달걀", "잡곡"],
        hours: "09:00 ~ 19:00",
        phone: "02-380-0000"
      },
      {
        name: "수원 팔달 농산물 직거래장터",
        address: "경기 수원시 팔달구 정조로 800",
        lat: 37.2820, lng: 127.0170,
        items: ["채소", "과일", "달걀"],
        hours: "08:00 ~ 20:00",
        phone: "031-228-0000"
      },
      {
        name: "성남 로컬푸드 직매장 (모란)",
        address: "경기 성남시 중원구 성남대로 997",
        lat: 37.4322, lng: 127.1290,
        items: ["채소", "달걀", "버섯"],
        hours: "09:00 ~ 20:00",
        phone: "031-729-0000"
      },
      {
        name: "고양 원당 농협 로컬푸드",
        address: "경기 고양시 덕양구 화중로 104",
        lat: 37.6540, lng: 126.8320,
        items: ["채소", "과일", "달걀", "쌀"],
        hours: "09:00 ~ 20:00",
        phone: "031-968-0000"
      },
      {
        name: "인천 계양 로컬푸드 직매장",
        address: "인천 계양구 계양대로 100",
        lat: 37.5370, lng: 126.7380,
        items: ["채소", "달걀", "잡곡"],
        hours: "09:00 ~ 19:00",
        phone: "032-500-0000"
      },
      {
        name: "대전 유성 로컬푸드 직매장",
        address: "대전 유성구 유성대로 500",
        lat: 36.3620, lng: 127.3560,
        items: ["채소", "과일", "달걀"],
        hours: "09:00 ~ 20:00",
        phone: "042-600-0000"
      },
      {
        name: "청주 농산물 도매시장 직판장",
        address: "충북 청주시 흥덕구 풍산로 15",
        lat: 36.6290, lng: 127.4200,
        items: ["채소", "과일", "달걀", "육류"],
        hours: "06:00 ~ 20:00",
        phone: "043-200-0000"
      }
    ];

    // ── 지도 초기화 ─────────────────────────────
    const map = L.map("map").setView([37.55, 127.0], 8);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자'
    }).addTo(map);

    // 판매장 아이콘 (초록 원)
    const marketIcon = L.divIcon({
      className: "",
      html:
        '<div style="width:26px;height:26px;background:#2e7d32;border:3px solid #fff;' +
        'border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;' +
        'align-items:center;justify-content:center;font-size:13px;">🥬</div>',
      iconSize: [26, 26],
      iconAnchor: [13, 13],
      popupAnchor: [0, -14]
    });

    // ── 상태 & 마커 ─────────────────────────────
    let activeCategory = "전체";
    let searchTerm = "";
    let userLatLng = null;
    const markers = new Map(); // index -> L.marker

    const listEl = document.getElementById("list");
    const countEl = document.getElementById("count");
    const filtersEl = document.getElementById("filters");
    const searchEl = document.getElementById("search");

    function popupHtml(m) {
      const tags = m.items
        .map(t => '<span class="tag">' + t + "</span>")
        .join(" ");
      const query = encodeURIComponent(m.name + " " + m.address);
      return (
        '<div class="popup-title">' + m.name + "</div>" +
        '<div class="popup-addr">📍 ' + m.address + "</div>" +
        '<div class="popup-addr">🕒 ' + m.hours + "</div>" +
        '<div class="popup-addr">☎ ' + m.phone + "</div>" +
        '<div class="popup-tags">' + tags + "</div>" +
        '<a class="popup-link" target="_blank" rel="noopener" ' +
        'href="https://map.kakao.com/?q=' + query + '">길찾기 / 지도에서 보기 →</a>'
      );
    }

    MARKETS.forEach((m, i) => {
      const marker = L.marker([m.lat, m.lng], { icon: marketIcon })
        .addTo(map)
        .bindPopup(popupHtml(m));
      marker.on("click", () => highlightItem(i));
      markers.set(i, marker);
    });

    // ── 카테고리 필터 칩 ─────────────────────────────
    const allCats = ["전체", ...new Set(MARKETS.flatMap(m => m.items))];
    allCats.forEach(cat => {
      const chip = document.createElement("button");
      chip.className = "chip" + (cat === "전체" ? " active" : "");
      chip.textContent = cat;
      chip.onclick = () => {
        activeCategory = cat;
        [...filtersEl.children].forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        render();
      };
      filtersEl.appendChild(chip);
    });

    // ── 거리 계산 (하버사인) ─────────────────────────────
    function distanceKm(a, b) {
      const R = 6371;
      const dLat = ((b.lat - a.lat) * Math.PI) / 180;
      const dLng = ((b.lng - a.lng) * Math.PI) / 180;
      const s =
        Math.sin(dLat / 2) ** 2 +
        Math.cos((a.lat * Math.PI) / 180) *
          Math.cos((b.lat * Math.PI) / 180) *
          Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
    }

    // ── 목록 렌더링 ─────────────────────────────
    function getFiltered() {
      let rows = MARKETS.map((m, i) => ({ m, i }));

      if (activeCategory !== "전체") {
        rows = rows.filter(r => r.m.items.includes(activeCategory));
      }
      if (searchTerm) {
        const t = searchTerm.toLowerCase();
        rows = rows.filter(
          r =>
            r.m.name.toLowerCase().includes(t) ||
            r.m.address.toLowerCase().includes(t) ||
            r.m.items.some(it => it.toLowerCase().includes(t))
        );
      }
      if (userLatLng) {
        rows.forEach(r => {
          r.dist = distanceKm(userLatLng, { lat: r.m.lat, lng: r.m.lng });
        });
        rows.sort((a, b) => a.dist - b.dist);
      }
      return rows;
    }

    function render() {
      const rows = getFiltered();
      countEl.textContent = "총 " + rows.length + "곳의 판매장";
      listEl.innerHTML = "";

      if (rows.length === 0) {
        listEl.innerHTML =
          '<div style="padding:24px;text-align:center;color:#6b7770;">' +
          "검색 결과가 없습니다.</div>";
        return;
      }

      rows.forEach(({ m, i, dist }) => {
        const div = document.createElement("div");
        div.className = "item";
        div.dataset.idx = i;
        const tags = m.items
          .map(t => '<span class="tag">' + t + "</span>")
          .join(" ");
        const distStr =
          dist != null
            ? '<span style="color:#2e7d32;font-weight:600;"> · ' +
              dist.toFixed(1) +
              "km</span>"
            : "";
        div.innerHTML =
          "<h3>" + m.name + "</h3>" +
          '<div class="addr">📍 ' + m.address + distStr + "</div>" +
          '<div class="tags">' + tags + "</div>" +
          '<div class="meta">🕒 ' + m.hours + " · ☎ " + m.phone + "</div>";
        div.onclick = () => {
          map.setView([m.lat, m.lng], 14, { animate: true });
          markers.get(i).openPopup();
          highlightItem(i);
        };
        listEl.appendChild(div);
      });
    }

    function highlightItem(idx) {
      [...listEl.children].forEach(c => c.classList.remove("active"));
      const el = listEl.querySelector('[data-idx="' + idx + '"]');
      if (el) {
        el.classList.add("active");
        el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }

    // ── 검색 입력 ─────────────────────────────
    searchEl.addEventListener("input", e => {
      searchTerm = e.target.value.trim();
      render();
    });

    // ── 내 위치 ─────────────────────────────
    document.getElementById("locateBtn").onclick = () => {
      if (!navigator.geolocation) {
        alert("이 브라우저에서는 위치 기능을 지원하지 않습니다.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          userLatLng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          L.circleMarker([userLatLng.lat, userLatLng.lng], {
            radius: 9,
            color: "#1565c0",
            fillColor: "#1e88e5",
            fillOpacity: 0.9
          })
            .addTo(map)
            .bindPopup("현재 내 위치")
            .openPopup();
          map.setView([userLatLng.lat, userLatLng.lng], 11);
          render();
        },
        () => alert("위치를 가져올 수 없습니다. 위치 권한을 확인해 주세요.")
      );
    };

    // 첫 렌더
    render();
  </script>

  <!-- ── AI 채소 판별 로직 ── -->
  <script>
    (function () {
      const MODEL_URL = "https://teachablemachine.withgoogle.com/models/2EssRstws/";

      // 채소별 설명
      const INFO = {
        "당근": {
          emoji: "🥕", title: "당근 (Carrot)",
          desc: "대표적인 뿌리채소예요. 주황빛을 내는 베타카로틴(비타민A 전구체)이 풍부해 눈 건강과 면역력에 도움을 줍니다. 생으로 아삭하게, 볶음·국·주스 등 다양하게 즐길 수 있어요.",
          tips: ["제철: 가을~겨울", "보관: 흙을 털고 신문지에 싸 냉장", "기름과 함께 조리하면 베타카로틴 흡수가 좋아져요"]
        },
        "양파": {
          emoji: "🧅", title: "양파 (Onion)",
          desc: "특유의 매운맛과 향을 내는 알리신·퀘르세틴이 풍부해 항산화와 혈액순환에 도움을 줍니다. 익히면 매운맛이 사라지고 단맛이 강해져 거의 모든 요리의 기본 재료로 쓰여요.",
          tips: ["제철: 봄~초여름", "보관: 서늘하고 건조한 곳에 망째 매달아 두기", "자른 것은 밀폐해 냉장"]
        },
        "오이": {
          emoji: "🥒", title: "오이 (Cucumber)",
          desc: "수분이 약 95%로 시원하고 칼로리가 낮아 여름철 수분 보충에 좋아요. 칼륨이 많아 붓기 완화에도 도움을 주며 생채·냉국·피클로 즐겨 먹습니다.",
          tips: ["제철: 여름", "보관: 물기를 닦아 키친타월에 싸 냉장", "꼭지가 마르지 않은 것이 신선해요"]
        },
        "호박": {
          emoji: "🎃", title: "호박 (Squash / Pumpkin)",
          desc: "베타카로틴과 식이섬유가 풍부해요. 애호박은 부드럽고 담백해 볶음·전에, 단호박·늙은호박은 단맛이 강해 죽·찜에 잘 어울립니다. 소화가 잘돼 이유식·회복식으로도 좋아요.",
          tips: ["제철: 여름(애호박) / 가을(단·늙은호박)", "보관: 통째로는 서늘한 실온, 자른 것은 씨 빼고 냉장", "껍질째 조리하면 영양 손실이 적어요"]
        },
        "달걀": {
          emoji: "🥚", title: "달걀 (Egg)",
          desc: "채소는 아니지만 판매장에서 함께 파는 대표 신선식품이에요. 필수아미노산을 고루 갖춘 '완전식품'으로 단백질이 풍부하고, 노른자에는 비타민·무기질이 많이 들어 있습니다.",
          tips: ["보관: 뾰족한 쪽을 아래로 하여 냉장 안쪽에", "신선도: 물에 넣어 가라앉으면 신선한 달걀", "※ 엄밀히는 채소가 아닌 축산물이에요"]
        }
      };

      const statusEl = document.getElementById("aiStatus");
      const previewEl = document.getElementById("preview");
      const barsEl = document.getElementById("bars");
      const explainEl = document.getElementById("explain");
      const btnWebcam = document.getElementById("btnWebcam");
      const btnStop = document.getElementById("btnStop");
      const fileInput = document.getElementById("fileInput");

      let model = null, webcam = null, webcamRunning = false;

      async function ensureModel() {
        if (model) return model;
        statusEl.textContent = "AI 모델을 불러오는 중…";
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
        statusEl.textContent = "준비 완료! 사진을 올리거나 웹캠을 켜 보세요.";
        return model;
      }

      function renderBars(preds) {
        barsEl.innerHTML = "";
        preds.forEach(function (p, idx) {
          const pct = Math.round(p.probability * 100);
          const row = document.createElement("div");
          row.className = "bar-row" + (idx === 0 ? " top" : "");
          row.innerHTML =
            '<div class="bar-label"><span>' + p.className + "</span><span>" + pct + "%</span></div>" +
            '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
          barsEl.appendChild(row);
        });
      }

      function renderExplain(top) {
        const info = INFO[top.className];
        if (!info) return;
        const conf = Math.round(top.probability * 100);
        explainEl.className = "ai-explain";
        explainEl.innerHTML =
          "<h3>" + info.emoji + " " + info.title +
          ' <span style="font-size:13px;color:#f57c00;font-weight:600;">(' + conf + "% 확신)</span></h3>" +
          "<p>" + info.desc + "</p>" +
          "<ul>" + info.tips.map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</ul>";
      }

      async function classify(source) {
        const m = await ensureModel();
        const preds = await m.predict(source);
        preds.sort(function (a, b) { return b.probability - a.probability; });
        renderBars(preds);
        renderExplain(preds[0]);
      }

      // 사진 업로드
      fileInput.addEventListener("change", function (e) {
        const file = e.target.files[0];
        if (!file) return;
        stopWebcam();
        const img = new Image();
        img.className = "ai-img";
        img.onload = async function () {
          previewEl.innerHTML = "";
          previewEl.appendChild(img);
          try { await classify(img); }
          catch (err) { statusEl.textContent = "인식 중 오류가 발생했어요. 다시 시도해 주세요."; }
        };
        img.src = URL.createObjectURL(file);
      });

      // 웹캠 실시간 인식
      btnWebcam.addEventListener("click", async function () {
        try {
          await ensureModel();
          if (webcamRunning) return;
          webcam = new tmImage.Webcam(400, 400, true);
          await webcam.setup();
          await webcam.play();
          webcamRunning = true;
          previewEl.innerHTML = "";
          previewEl.appendChild(webcam.canvas);
          btnStop.hidden = false;
          statusEl.textContent = "웹캠으로 실시간 인식 중… 채소를 카메라에 비춰 보세요.";
          loop();
        } catch (err) {
          statusEl.textContent = "웹캠을 사용할 수 없어요. 카메라 권한을 확인해 주세요.";
        }
      });

      async function loop() {
        if (!webcamRunning) return;
        webcam.update();
        try { await classify(webcam.canvas); } catch (e) {}
        window.requestAnimationFrame(loop);
      }

      function stopWebcam() {
        webcamRunning = false;
        btnStop.hidden = true;
        if (webcam) { try { webcam.stop(); } catch (e) {} webcam = null; }
      }

      btnStop.addEventListener("click", function () {
        stopWebcam();
        previewEl.innerHTML = '<div class="ai-placeholder">여기에 사진/영상이 표시됩니다</div>';
        statusEl.textContent = "웹캠을 껐어요. 다시 켜거나 사진을 올려 보세요.";
      });

      // 페이지 로드 시 모델 미리 준비
      ensureModel().catch(function () {
        statusEl.textContent = "모델을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.";
      });
    })();
  </script>
</body>
</html>
